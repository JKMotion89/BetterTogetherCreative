<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Better Together Creative Studio — New website coming soon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--muted:#6b6b6b;--lime:#cfd641;--inv:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#fff;--muted:#9a9a9a;--inv:1}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#fff;--muted:#9a9a9a;--inv:1}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Raleway',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4vh,40px);padding:24px;text-align:center;pointer-events:none}
.logo{width:min(780px,88vw);height:auto;overflow:visible;pointer-events:auto;touch-action:none}
.logo .wm{filter:invert(var(--inv))}
.logo circle{fill:var(--lime);cursor:grab}
.tag{font-weight:500;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(12px,1.6vw,15px);display:flex;align-items:center;gap:14px}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--lime);display:inline-block;animation:p 1.8s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.7);opacity:.5}}
.sub{color:var(--muted);font-size:clamp(13px,1.8vw,16px);margin:0}
.mail{color:var(--fg);font-weight:500;font-size:clamp(13px,1.8vw,16px);text-decoration:none;border-bottom:2px solid var(--lime);padding-bottom:2px;pointer-events:auto;transition:background .2s}
.mail:hover,.mail:focus-visible{background:var(--lime);color:#0a0a0a;outline:none}
.rise{opacity:0;transform:translateY(14px);animation:r .9s .25s cubic-bezier(.2,.7,.2,1) forwards}
.rise.b{animation-delay:.5s}.rise.c{animation-delay:.75s}.rise.d{animation-delay:1s}
@keyframes r{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}.tag i{animation:none}}
</style>
</head>

<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,dpr=Math.min(devicePixelRatio||1,2);
  var LIME='#cfd641',ptr={x:-999,y:-999},P=[],reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  function mk(x,y,burst){var a=Math.random()*6.283,s=burst?2+Math.random()*5:.15+Math.random()*.3;
    return{x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:burst?3+Math.random()*7:2+Math.random()*5,life:burst?1:null,o:.25+Math.random()*.5}}
  function init(){P=[];var n=Math.round(Math.min(70,W*H/16000));for(var i=0;i<n;i++)P.push(mk(Math.random()*W,Math.random()*H))}
  size();init();
  addEventListener('resize',function(){size();init()});
  addEventListener('pointermove',function(e){ptr.x=e.clientX;ptr.y=e.clientY});
  addEventListener('pointerleave',function(){ptr.x=ptr.y=-999});
  addEventListener('pointerdown',function(e){for(var i=0;i<18;i++)P.push(mk(e.clientX,e.clientY,true));bump(e.clientX,e.clientY)});
  // logo dots: springs
  var svg=document.getElementById('logo'),D=[1,2].map(function(n){var el=document.getElementById('d'+n);
    return{el:el,hx:+el.getAttribute('cx'),hy:+el.getAttribute('cy'),x:0,y:0,vx:0,vy:0,drag:false}});
  function toSvg(cx,cy){var p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
  function bump(cx,cy){var p=toSvg(cx,cy);D.forEach(function(d){var dx=d.hx+d.x-p.x,dy=d.hy+d.y-p.y;if(Math.hypot(dx,dy)<60){d.vy-=14;d.vx+=(Math.random()-.5)*8}})}
  D.forEach(function(d){d.el.addEventListener('pointerdown',function(e){d.drag=true;d.el.setPointerCapture(e.pointerId);e.stopPropagation()});
    d.el.addEventListener('pointermove',function(e){if(d.drag){var p=toSvg(e.clientX,e.clientY);d.x=p.x-d.hx;d.y=p.y-d.hy;d.vx=d.vy=0}});
    d.el.addEventListener('pointerup',function(){d.drag=false})});
  function frame(){
    ctx.clearRect(0,0,W,H);ctx.fillStyle=LIME;
    for(var i=P.length-1;i>=0;i--){var p=P[i],dx=p.x-ptr.x,dy=p.y-ptr.y,d=Math.hypot(dx,dy);
      if(d<140&&d>0){var f=(140-d)/140*.9;p.vx+=dx/d*f;p.vy+=dy/d*f}
      p.vx*=.97;p.vy*=.97;
      if(p.life===null){if(Math.hypot(p.vx,p.vy)<.2){p.vx+=(Math.random()-.5)*.05;p.vy+=(Math.random()-.5)*.05}}else{p.life-=.012;if(p.life<=0){P.splice(i,1);continue}}
      if(!reduce){p.x+=p.vx;p.y+=p.vy}
      if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
      ctx.globalAlpha=(p.life===null?p.o:p.life*p.o+.1);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}
    ctx.globalAlpha=1;
    var m=ptr.x>-900?toSvg(ptr.x,ptr.y):null;
    D.forEach(function(d){
      if(!d.drag){
        if(m){var dx=d.hx+d.x-m.x,dy=d.hy+d.y-m.y,dist=Math.hypot(dx,dy);if(dist<150&&dist>0){var f=(150-dist)/150*2.2;d.vx+=dx/dist*f;d.vy+=dy/dist*f}}
